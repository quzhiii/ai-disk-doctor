id: model-files
name: AI model weight files
category: ai-model
platforms: [windows, linux, macos]
paths:
  windows:
    - '%USERPROFILE%\**\*.gguf'
    - '%USERPROFILE%\**\*.safetensors'
    - '%USERPROFILE%\**\*.onnx'
    - '%USERPROFILE%\**\*.mlx'
  linux:
    - '~/**/*.gguf'
    - '~/**/*.safetensors'
    - '~/**/*.onnx'
    - '~/**/*.mlx'
  macos:
    - '~/**/*.gguf'
    - '~/**/*.safetensors'
    - '~/**/*.onnx'
    - '~/**/*.mlx'
risk: review
cleanup:
  method: report-only
exclusions: []
reason: "Model weight files in standard formats can be public downloads, private fine-tunes, or locally converted assets. Treat unknown model files as report-only until provenance is verified."
warnings:
  - "GGUF files are used by Ollama, llama.cpp, and LM Studio for local inference. Do not assume they are re-downloadable."
  - "SafeTensors files may be downloaded from HuggingFace or produced by private fine-tunes. Check provenance before cleanup."
  - "ONNX files are cross-platform model weights. Verify the original source is available before removal."
