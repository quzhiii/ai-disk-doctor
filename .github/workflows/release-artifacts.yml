name: Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive_ext: .zip
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            exe_suffix: .exe
            archive_ext: .zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive_ext: .tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            archive_ext: .tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe_suffix: ""
            archive_ext: .tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive_ext: .tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --manifest-path aidisk/Cargo.toml --target ${{ matrix.target }}
      - name: Package artifact, checksum, SBOM, and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Select-String -Path "aidisk/Cargo.toml" -Pattern '^version = "([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          $target = "${{ matrix.target }}"
          $packageName = "aidisk-v$version-$target"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $binary = "aidisk/target/$target/release/aidisk${{ matrix.exe_suffix }}"
          Copy-Item $binary (Join-Path $packageDir "aidisk${{ matrix.exe_suffix }}")
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $packageDir
          Copy-Item Start-AIDiskDoctor.ps1 $packageDir
          Copy-Item aidisk/rules (Join-Path $packageDir "rules") -Recurse
          Copy-Item aidisk/config (Join-Path $packageDir "config") -Recurse
          Copy-Item docs/report-schema.md (Join-Path $packageDir "report-schema.md")

          $archive = "dist/$packageName${{ matrix.archive_ext }}"
          if ("${{ matrix.archive_ext }}" -eq ".zip") {
            Compress-Archive -Path $packageDir -DestinationPath $archive -Force
          } else {
            tar -czf $archive -C dist $packageName
          }

          $hash = Get-FileHash -Algorithm SHA256 $archive
          "$($hash.Hash.ToLower())  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "dist/$packageName.sha256"

          cargo metadata --format-version 1 --manifest-path aidisk/Cargo.toml | Set-Content -Encoding utf8 "dist/$packageName.sbom.cargo-metadata.json"

          $provenance = [ordered]@{
            package = Split-Path $archive -Leaf
            target = $target
            version = $version
            repository = "${{ github.repository }}"
            ref = "${{ github.ref }}"
            sha = "${{ github.sha }}"
            runner = "${{ matrix.os }}"
            workflow = "${{ github.workflow }}"
            build_command = "cargo build --release --manifest-path aidisk/Cargo.toml --target $target"
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "dist/$packageName.provenance.json"
      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = Select-String -Path "aidisk/Cargo.toml" -Pattern '^version = "([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          $target = "${{ matrix.target }}"
          $packageName = "aidisk-v$version-$target"
          $archive = "dist/$packageName${{ matrix.archive_ext }}"
          $smokeDir = "dist/smoke-$target"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          if ("${{ matrix.archive_ext }}" -eq ".zip") {
            Expand-Archive -Path $archive -DestinationPath $smokeDir -Force
          } else {
            tar -xzf $archive -C $smokeDir
          }
          $binary = Join-Path $smokeDir "$packageName/aidisk${{ matrix.exe_suffix }}"
          if (-not (Test-Path $binary)) {
            throw "Packaged binary not found: $binary"
          }
          if ($target -eq "aarch64-pc-windows-msvc") {
            Write-Host "Skipping execution smoke for $target on x64 Windows runner; archive contents verified."
            return
          }
          $binary = (Resolve-Path $binary).Path
          if ("${{ matrix.exe_suffix }}" -eq "") { chmod +x $binary }
          & $binary --help
          & $binary scan --help
          $capabilities = & $binary capabilities --json | ConvertFrom-Json
          if ($capabilities.contract -ne "agent-capabilities-v1") {
            throw "Packaged binary did not advertise agent-capabilities-v1."
          }
          if ($capabilities.capabilities.explainability.contract -ne "explainability-v1") {
            throw "Packaged binary did not advertise explainability-v1."
          }
          if ($capabilities.capabilities.explainability.snapshot_modes -notcontains "skip") {
            throw "Packaged binary did not advertise snapshot skip mode."
          }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "aidisk-agent-smoke"
          $fixtureProject = Join-Path $fixtureRoot "project"
          $fixtureCache = Join-Path $fixtureProject "node_modules"
          New-Item -ItemType Directory -Force -Path $fixtureCache | Out-Null
          Set-Content -Encoding ascii -Path (Join-Path $fixtureCache "artifact.bin") -Value "package-smoke"
          $previousUserProfile = $env:USERPROFILE
          $previousHome = $env:HOME
          $previousLocalAppData = $env:LOCALAPPDATA
          $previousAppData = $env:APPDATA
          $env:USERPROFILE = $fixtureRoot
          $env:HOME = $fixtureRoot
          $env:LOCALAPPDATA = Join-Path (Join-Path $fixtureRoot "AppData") "Local"
          $env:APPDATA = Join-Path (Join-Path $fixtureRoot "AppData") "Roaming"
          Push-Location $fixtureRoot
          try {
            $explain = & $binary explain --json --snapshot skip --category dev-artifact | ConvertFrom-Json
          } finally {
            Pop-Location
            $env:USERPROFILE = $previousUserProfile
            $env:HOME = $previousHome
            $env:LOCALAPPDATA = $previousLocalAppData
            $env:APPDATA = $previousAppData
          }
          if ($explain.contract -ne "agent-diagnostic-cli-v1") {
            throw "Packaged binary did not return agent-diagnostic-cli-v1."
          }
          if ($explain.snapshot.requested -ne "skip" -or $explain.snapshot.persisted -ne $false) {
            throw "Packaged binary did not preserve snapshot skip semantics."
          }
          if ($explain.explainability.contract -ne "explainability-v1") {
            throw "Packaged binary did not embed explainability-v1."
          }
          & $binary rules lint --json
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: aidisk-${{ matrix.target }}
          path: |
            dist/aidisk-v*-${{ matrix.target }}${{ matrix.archive_ext }}
            dist/aidisk-v*-${{ matrix.target }}.sha256
            dist/aidisk-v*-${{ matrix.target }}.sbom.cargo-metadata.json
            dist/aidisk-v*-${{ matrix.target }}.provenance.json
